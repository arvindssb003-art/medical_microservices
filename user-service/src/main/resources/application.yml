server:
  port: 8082

spring:
  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/medical-shop

keycloak:
  server-url: http://localhost:8080
  realm: medical-shop

  admin:
    username: admin11111
    password: Admin12345

  client:
    id: medical-shop-client

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info