server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/medical-shop}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:medical-shop}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin11111}
    password: ${KEYCLOAK_ADMIN_PASSWORD:Admin12345}
  client:
    id: ${KEYCLOAK_CLIENT_ID:medical-shop-client}