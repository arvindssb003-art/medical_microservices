server:
  port: ${GATEWAY_PORT:8081}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/medical-shop}

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: medicine-service
              uri: lb://medicine-service
              predicates:
                - Path=/api/medicines/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**

            - id: prescription-service
              uri: lb://prescription-service
              predicates:
                - Path=/api/prescriptions/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**