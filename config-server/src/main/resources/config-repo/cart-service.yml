server:
  port: 8087

spring:
  datasource:
    url: ${CART_DB_URL}
    username: ${CART_DB_USERNAME}
    password: ${CART_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}