services:
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: config-server
    image: medical-config-server:local
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8888/actuator/health | grep -q 'UP'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  service-registry:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: service-registry
    image: medical-service-registry:local
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: gateway
    image: medical-gateway:local
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8080/realms/medical-shop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: auth-service
    image: medical-auth-service:local
    environment: &spring-client-environment
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: postgres
      AUTH_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: cart-service
    image: medical-cart-service:local
    environment:
      <<: *spring-client-environment
      CART_DB_URL: jdbc:postgresql://postgres:5432/cart_db
      CART_DB_USERNAME: postgres
      CART_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: delivery-service
    image: medical-delivery-service:local
    environment:
      <<: *spring-client-environment
      DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/delivery_db
      DELIVERY_DB_USERNAME: postgres
      DELIVERY_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: inventory-service
    image: medical-inventory-service:local
    environment:
      <<: *spring-client-environment
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_USERNAME: postgres
      INVENTORY_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  medicine-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: medicine-service
    image: medical-medicine-service:local
    environment:
      <<: *spring-client-environment
      MEDICINE_DB_URL: jdbc:postgresql://postgres:5432/medicine_db
      MEDICINE_DB_USERNAME: postgres
      MEDICINE_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: notification-service
    image: medical-notification-service:local
    environment:
      <<: *spring-client-environment
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: order-service
    image: medical-order-service:local
    environment:
      <<: *spring-client-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_DB_USERNAME: postgres
      ORDER_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: payment-service
    image: medical-payment-service:local
    environment:
      <<: *spring-client-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_USERNAME: postgres
      PAYMENT_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: on-failure

  prescription-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: prescription-service
    image: medical-prescription-service:local
    environment:
      <<: *spring-client-environment
      PRESCRIPTION_DB_URL: jdbc:postgresql://postgres:5432/prescription_db
      PRESCRIPTION_DB_USERNAME: postgres
      PRESCRIPTION_DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
      postgres:
        condition: service_started
    restart: on-failure

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: user-service
    image: medical-user-service:local
    ports:
      - "8082:8082"
    environment:
      <<: *spring-client-environment
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8080/realms/medical-shop}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://host.docker.internal:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-medical-shop}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin11111}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin12345}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-medical-shop-client}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: on-failure

  chatbot-service:
    profiles:
      - chatbot
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    image: medical-chatbot-service:local
    ports:
      - "8000:8000"
    env_file:
      - ./chatbot-service/.env
    depends_on:
      user-service:
        condition: service_started
      medicine-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    restart: on-failure

  kafka:
    image: apache/kafka:4.0.0
    container_name: medical-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: medical-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
